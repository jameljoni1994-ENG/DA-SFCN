[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dasfcn"
version = "0.1.0"
description = "Dynamically-Adaptive Saddle-Free Cubic Newton (DA-SFCN) family"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DA-SFCN contributors" }]
keywords = ["optimization", "newton", "krylov", "nonconvex", "second-order"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/jameljoni1994-ENG/DA-SFCN"
Repository = "https://github.com/jameljoni1994-ENG/DA-SFCN"
Roadmap = "https://github.com/jameljoni1994-ENG/DA-SFCN/blob/main/docs/OPTIMIZER.md"

[tool.setuptools.packages.find]
include = ["dasfcn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
